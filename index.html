<script>
async function runAll(){
let main=document.getElementById('main');
main.innerHTML='⏳ Scanning GPS + IP + VPN...';
let ipData={};
try{
let res=await fetch('https://ipapi.co/json/');
ipData=await res.json();
}catch(e){ipData={city:'Unknown',country_name:'Unknown',country:'US',org:'Unknown',ip:'Unknown'}}

navigator.geolocation.getCurrentPosition(pos=>{
let acc=pos.coords.accuracy;
let lat=pos.coords.latitude;
let lon=pos.coords.longitude;
let tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
let score=100;
let checks=[];
let org=(ipData.org||'').toLowerCase();

//1 GPS
if(acc<50 && acc>0){checks.push(['GPS Accuracy',acc.toFixed(1)+'m',true]);}else{checks.push(['GPS Accuracy',acc.toFixed(1)+'m Fake?',false]);score-=20;}
//2 Mock
if(acc===0 || acc>500){checks.push(['Mock Location','Suspected!',false]);score-=30;}else{checks.push(['Mock Location','Not Detected',true]);}
//3 Timezone
checks.push(['Timezone',tz,tz.includes('Asia')]);
//4 Altitude
checks.push(['Altitude',(pos.coords.altitude||0).toFixed(1)+'m',true]);
//5 IP
checks.push(['IP City',(ipData.city||'Unknown')+', '+(ipData.country_name||'Unknown'),true]);

//6 VPN - NEW STRONG LOGIC
let vpnKeywords=['vpn','m247','datacamp','host','cloud','digitalocean','linode','ovh','hetzner','amazon','google','choopa','colocrossing'];
let isVPN=vpnKeywords.some(k=>org.includes(k));
if(isVPN){checks.push(['VPN / Proxy',ipData.org+' - VPN Detected!',false]);score-=35;}else{checks.push(['VPN / Proxy',ipData.org||'No VPN',true]);}

//7 IP vs GPS - NEW STRONG LOGIC
let ipCountry=ipData.country||'US';
let gpsInSaudi=lat>16 && lat<33 && lon>34 && lon<56;
let ipIsSaudi=ipCountry==='SA';
let mismatch = (gpsInSaudi && !ipIsSaudi) || (!gpsInSaudi && ipIsSaudi) || (ipCountry==='US' && gpsInSaudi);
if(mismatch){checks.push(['IP vs GPS Match','Mismatch! '+ipCountry+' vs SA GPS',false]);score-=30;}else{checks.push(['IP vs GPS Match','Matched '+ipCountry,true]);}

checks.push(['Speed',(pos.coords.speed||0).toFixed(1)+' m/s',true]);

let status=score>=80?'✅ REAL LOCATION':score>=50?'⚠️ SUSPICIOUS':'❌ FAKE GPS / VPN';
let cls=score>=80?'pass':score>=50?'warn':'fail';
main.innerHTML=`<div style="font-size:22px;font-weight:900;margin:8px 0">${status}</div><span class="badge ${cls}">Trust: ${score}%</span><br><span style="font-size:11px">GPS: ${lat.toFixed(4)},${lon.toFixed(4)} | IP: ${ipData.ip||''}<br>Acc: ${acc.toFixed(1)}m | ISP: ${ipData.org||''}</span>`;

let html='';
checks.forEach(c=>{
html+=`<div class="row"><span>${c[0]}</span><span class="badge ${c[2]?'pass':'fail'}">${c[1]}</span></div>`;
});
document.getElementById('list').innerHTML=html;
document.getElementById('final').innerHTML=`<span class="badge ${cls}" style="font-size:15px;padding:8px 14px">FINAL: ${score}% ${score>=80?'SAFE':'RISK'}</span>`;
document.getElementById('report').style.display='block';
},e=>{main.innerHTML='❌ Enable Location: '+e.message},{enableHighAccuracy:true,timeout:15000});
}
</script>
