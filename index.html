<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Callsign</title>
</head>
<body style="background:#0f172a;color:#fff;font-family:system-ui;padding:20px;text-align:center">
<h1>🛡️ Mini Callsign PRO</h1>
<p>For Saleem Bhai</p>
<button onclick="check()" style="width:100%;padding:18px;background:#22c55e;border:none;border-radius:12px;font-weight:900;font-size:18px">📍 CHECK MY GPS + VPN NOW</button>
<div id="out" style="margin-top:20px;background:#1e293b;padding:15px;border-radius:12px">Click button to start</div>
<script>
function check(){
let out=document.getElementById('out');
out.innerHTML='Getting location...';
navigator.geolocation.getCurrentPosition(async p=>{
let lat=p.coords.latitude, lon=p.coords.longitude, acc=p.coords.accuracy;
let ipText='Fetching IP...';
try{
let r=await fetch('https://ipapi.co/json/');
let j=await r.json();
ipText=j.city+', '+j.country_name+' | ISP: '+j.org+' | IP: '+j.ip;
let isVPN=(j.org||'').toLowerCase().includes('m247')||j.country!=='SA';
let msg=isVPN?'❌ VPN DETECTED / MISMATCH':'✅ NO VPN';
ipText+='<br><b>'+msg+'</b>';
}catch(e){ipText='IP check failed (adblock?)';}
out.innerHTML='GPS: '+lat.toFixed(5)+','+lon.toFixed(5)+'<br>Acc: '+acc.toFixed(1)+'m<br>'+ipText+'<br><br><b>Trust: '+(acc<50?'80% REAL':'30% FAKE')+'</b>';
},e=>{out.innerHTML='Error: '+e.message+' - Location ON karo'});
}
</script>
</body>
</html>
