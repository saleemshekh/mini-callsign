<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Callsign PRO</title>
</head>
<body style="background:#0f172a;color:#fff;font-family:system-ui;padding:20px;text-align:center">
<h1>🛡️ Mini Callsign PRO</h1>
<p style="color:#94a3b8">For Saleem Bhai | Dubai Ready | v6 Fixed</p>
<button onclick="check()" style="width:100%;padding:18px;background:#22c55e;border:none;border-radius:12px;font-weight:900;font-size:18px">📍 CHECK MY GPS + VPN NOW</button>
<div id="out" style="margin-top:20px;background:#1e293b;padding:15px;border-radius:12px;text-align:left;line-height:1.6">Click to start</div>
<script>
async function check(){
let out=document.getElementById('out');
out.innerHTML='⏳ Scanning...';
let ip={city:'?',country:'?',country_code:'SA',org:'?',ip:'?'};
try{
let r=await fetch('https://ipwho.is/');
let j=await r.json();
if(j.success){ip={city:j.city,country:j.country,country_code:j.country_code,org:j.connection.isp,ip:j.ip};}
}catch(e){}
navigator.geolocation.getCurrentPosition(p=>{
let lat=p.coords.latitude, lon=p.coords.longitude, acc=p.coords.accuracy;
let org=(ip.org||'').toLowerCase();
let vpnKeys=['m247','vpn','datacamp','digitalocean','choopa','amazon','google','cloud','ovh','hetzner'];
let isVPN=vpnKeys.some(k=>org.includes(k));

// FIX 1: Acc 0.0 = FAKE!
let isMock = (acc===0 || acc<1 || acc>200);
let isSaudi = lat>16 && lat<33 && lon>34 && lon<56;
let ipIsSaudi = (ip.country_code==='SA');

// FIX 2: Nigeria jaise fake ko pakadna
let mismatch = false;
if(isSaudi && !ipIsSaudi) mismatch=true; // Riyadh GPS but NL IP
if(!isSaudi && ipIsSaudi) mismatch=true; // Nigeria GPS but SA IP = FAKE!
if(acc===0) mismatch=true;

let score=100;
let issues=[];
if(isMock){score-=40;issues.push('Mock/Fake GPS App (Acc 0.0m)');}
else if(acc>100){score-=15;issues.push('Weak GPS '+acc.toFixed(1)+'m');}
if(isVPN){score-=35;issues.push('VPN: '+ip.org);}
if(mismatch){score-=40;issues.push('Location Mismatch: GPS '+lat.toFixed(2)+','+lon.toFixed(2)+' is not in '+ip.country_code);}

let status=score>=80?'✅ REAL LOCATION':score>=50?'⚠️ SUSPICIOUS':'❌ FAKE / VPN';
let color=score>=80?'#22c55e':score>=50?'#f59e0b':'#ef4444';

out.innerHTML='<b>GPS:</b> '+lat.toFixed(5)+','+lon.toFixed(5)+(isSaudi?' (SA)':' (Outside SA!)')+'<br><b>Acc:</b> '+acc.toFixed(1)+'m '+(isMock?'<span style=color:#ef4444>❌ FAKE APP!</span>':'<span style=color:#22c55e>✅ Good</span>')+'<br><b>IP:</b> '+ip.city+', '+ip.country+' ('+ip.country_code+')<br><b>ISP:</b> '+ip.org+'<br><br><b>VPN:</b> '+(isVPN?'<span style=color:#ef4444>DETECTED ❌</span>':'<span style=color:#22c55e>NO VPN ✅</span>')+'<br><b>IP vs GPS:</b> '+(mismatch?'<span style=color:#ef4444>Mismatch ❌</span>':'<span style=color:#22c55e>Matched ✅</span>')+'<br><br><div style=text-align:center;background:'+color+';color:#000;padding:12px;border-radius:8px;font-weight:900;font-size:20px>'+status+' - '+score+'%</div>'+(issues.length?'<br><small style=color:#fca5a5>Issues: '+issues.join('<br>')+'</small>':'');
},{enableHighAccuracy:true,timeout:15000});
}
</script>
</body>
</html>
