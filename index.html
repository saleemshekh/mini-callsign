<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Callsign v12 FINAL</title>
<style>body{background:#0f172a;color:#fff;font-family:system-ui;padding:20px;text-align:center} .card{background:#1e293b;padding:15px;border-radius:12px;text-align:left;line-height:1.7;margin-top:15px} .b{padding:14px;border-radius:10px;font-weight:900;font-size:20px;text-align:center}</style>
</head><body>
<h1>🛡️ Mini Callsign v12 FINAL</h1>
<p style="color:#fbbf24;font-weight:900">v12 - VPN FORCE DETECT - Dubai Ready</p>
<button onclick="check()" style="width:100%;padding:18px;background:#ef4444;border:none;border-radius:12px;font-weight:900;font-size:18px;color:#fff">📍 CHECK VPN IS ON?</button>
<div id="out" class="card">v12 ready - VPN ON hai toh ab pakdega</div>
<script>
async function getIP(){
try{
let r=await fetch('https://ipapi.co/json/'); let j=await r.json();
return {city:j.city,country:j.country_name,country_code:j.country_code,org:j.org,ip:j.ip,ok:true};
}catch(e){}
try{
let r=await fetch('https://ipwho.is/'); let j=await r.json();
if(j.success) return {city:j.city,country:j.country,country_code:j.country_code,org:j.connection.isp,ip:j.ip,ok:true};
}catch(e){}
return {city:'Blocked',country:'Blocked by VPN',country_code:'XX',org:'VPN is blocking IP check - Suspected VPN',ok:false};
}
async function check(){
let out=document.getElementById('out'); out.innerHTML='⏳ Checking IP... VPN ON hai toh Blocked dikhega';
let ip=await getIP();
navigator.geolocation.getCurrentPosition(p=>{
let lat=p.coords.latitude, lon=p.coords.longitude, acc=p.coords.accuracy;
let isMock=(acc===0);
let isVPN=!ip.ok || ip.country_code!=='SA' || ip.country_code==='XX';
let score=isVPN?10:100;
let status=isVPN?'❌ VPN DETECTED - 10%':'✅ REAL LOCATION - 100%';
let color=isVPN?'#ef4444':'#22c55e';
out.innerHTML='<b>GPS:</b> '+lat.toFixed(5)+','+lon.toFixed(5)+' (Riyadh)<br><b>Acc:</b> '+acc.toFixed(1)+'m<br><b>IP:</b> '+ip.city+', '+ip.country+' ('+ip.country_code+')<br><b>IP:</b> '+ (ip.ip||'') +'<br><b>ISP:</b> '+ip.org+'<br><br><b>VPN:</b> '+(isVPN?'<span style=color:#ef4444>YES - ON HAI ❌</span>':'<span style=color:#22c55e>NO - OFF hai ✅</span>')+'<br><br><div class=b style=background:'+color+';color:#000>'+status+'</div><br><small>'+(ip.ok?'IP mil gaya':'IP Blocked = VPN ON hai isliye')+'</small>';
},e=>{out.innerHTML='GPS Error '+e.message+'<br>IP: '+ip.city+' '+ip.country;},{enableHighAccuracy:true,timeout:10000});
}
</script></body></html>
