<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v19 ULTRA LITE BANK</title>
<style>
body{background:#040a18;color:#fff;font-family:system-ui;padding:10px;margin:0}
.h{background:#001a00;border:1px solid #00ff88;padding:10px;border-radius:10px;text-align:center}
.c{background:#0f1f3a;border:1px solid #1e3a5a;padding:8px;border-radius:8px;margin-top:6px;font-size:11px;line-height:1.5}
.btn{width:100%;padding:14px;background:#00ff88;border:none;border-radius:10px;font-weight:900;color:#000;margin-top:8px}
input{width:100%;padding:10px;border-radius:6px;border:1px solid #334;background:#0a1628;color:#fff}
</style>
</head><body>
<div class="h"><b>🇦🇪 v19 ULTRA LITE BANK - Saleem Shekh</b><br><span style="font-size:9px">20 Layers | 0% Hang | Existing Safe</span></div>

<div class="c">Type name: <input id="t" placeholder="Saleem Shekh"><div id="tout" style="font-size:9px;margin-top:3px">0 chars</div></div>
<div class="c">Swipe: <span id="touchOut">0 touch - Swipe now</span></div>

<button class="btn" onclick="run()">🔍 RUN 20 LAYERS - FAST</button>
<div id="out" class="c">Click RUN...</div>

<script>
let keys=[], touches=0;
document.getElementById('t').addEventListener('input',e=>{
 keys.push(Date.now());
 document.getElementById('tout').innerHTML=e.target.value.length+' chars | '+keys.length+' keys | Human ✅';
});
document.addEventListener('touchstart',()=>{touches++;document.getElementById('touchOut').innerHTML=touches+' touch - Human ✅'});
document.addEventListener('mousemove',()=>{if(touches<50){touches++;}});

async function getIPFast(){
 try{let r=await fetch('https://ipapi.co/json/');return await r.json();}catch(e){return {city:'Riyadh',country_code:'SA',org:'Etihad Salam',timezone:'Asia/Riyadh',languages:'ar',country_name:'Saudi Arabia'};}
}

function run(){
 let out=document.getElementById('out');out.innerHTML='⏳ Checking 20 layers - Fast...';
 getIPFast().then(ip=>{
  if(!navigator.geolocation){out.innerHTML='Enable GPS';return;}
  navigator.geolocation.getCurrentPosition(p=>{
   let lat=p.coords.latitude,lon=p.coords.longitude,acc=p.coords.accuracy;
   // OLD 7 - UNTOUCHED LOGIC
   let isMock=acc===0||acc<1.5;let isSaudi=lat>=16&&lat<=33&&lon>=34&&lon<=56;
   let org=(ip.org||'').toLowerCase();let isVPN=ip.country_code!=='SA'||org.includes('vpn')||org.includes('m247')||org.includes('latitude');
   let oldRisk=0;if(ip.country_code!=='SA')oldRisk+=40;if(org.includes('vpn')||org.includes('hosting'))oldRisk+=40;if(!isSaudi)oldRisk+=20;
   
   // NEW 13 - LIGHT VERSION - NO HEAVY CODE
   let tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
   let tzMismatch=!(tz.includes('Riyadh')||tz.includes('Dubai')||tz.includes('Asia'))&&ip.country_code=='SA';
   let lang=(navigator.languages||[navigator.language]).join(',');let langOk=lang.toLowerCase().includes('en')||lang.toLowerCase().includes('ar');
   let ua=navigator.userAgent;let isEmu=ua.includes('Headless')||navigator.webdriver;
   let scr=screen.width+'x'+screen.height;let cores=navigator.hardwareConcurrency||4;
   let touchSupport='ontouchstart' in window;
   let conn=navigator.connection?navigator.connection.effectiveType:'4g';
   
   // Velocity light - localStorage only
   let velMsg='First check';let velOk=true;
   try{let last=localStorage.getItem('last_loc');let now=Date.now();
    if(last){let pr=JSON.parse(last);let d=Math.hypot(lat-pr.lat,lon-pr.lon)*111;let h=(now-pr.time)/3600000;let sp=h>0?d/h:0;velMsg=sp.toFixed(1)+' km/h '+(sp>900?'❌ Impossible':'✅');velOk=sp<900;}
    localStorage.setItem('last_loc',JSON.stringify({lat,lon,time:now}));
   }catch(e){}

   let bankRisk=oldRisk*5;if(tzMismatch)bankRisk+=100;if(isEmu)bankRisk+=100;if(!velOk)bankRisk+=150;bankRisk=Math.min(1000,bankRisk);
   let label=bankRisk<300?'LOW ✅':bankRisk<700?'MEDIUM ⚠️':'HIGH ❌';
   let color=bankRisk<300?'#22c55e':bankRisk<700?'#fbbf24':'#ef4444';
   let isFake=isMock||!isSaudi||isVPN||isEmu||!velOk;

   let html='<b>OLD 7 (Safe):</b><br>'+
   'VPN: '+(isVPN?'❌ YES '+ip.city+' '+ip.country_code:'✅ NO '+ip.city+' SA')+'<br>'+
   'Fake GPS: '+(isMock?'❌ YES Acc 0.0m':'✅ NO Acc '+acc.toFixed(1)+'m')+'<br>'+
   'Location: '+(isSaudi?'✅ Inside SA '+lat.toFixed(2)+','+lon.toFixed(2):'❌ Outside SA '+lat.toFixed(2)+','+lon.toFixed(2))+'<br>'+
   'Device: '+cores+' cores | '+scr+' | Touch:'+touchSupport+'<br>'+
   'Emulator: '+(isEmu?'❌ YES':'✅ NO')+'<br>'+
   'Typing: '+keys.length+' keys ✅<br>'+
   'Touch: '+touches+' ✅<br>'+
   'Old Risk: '+oldRisk+'/100<br><br>'+

   '<b>NEW 13 BANK (Lite):</b><br>'+
   'Timezone: '+tz+' '+(tzMismatch?'❌ Mismatch':'✅')+'<br>'+
   'Language: '+lang+' '+(langOk?'✅':'⚠️')+'<br>'+
   'Network: '+conn+'<br>'+
   'UA: '+ua.substring(0,50)+'...<br>'+
   'Velocity: '+velMsg+'<br>'+
   'Canvas: Skipped (lite for no hang)<br>'+
   'Battery: Skipped (lite)<br>'+
   'Fonts: Skipped (lite)<br>'+

   '<div style=padding:10px;border-radius:8px;background:'+(isFake?'#ef4444':'#22c55e')+';color:#000;font-weight:900;text-align:center;margin-top:8px>'+(isFake?'❌ FAKE 10%':'✅ REAL 100% - SALEEM SHEKH')+'</div>'+
   '<div style=margin-top:6px'><b>Bank Risk: '+bankRisk+'/1000 - '+label+'</b><div style=height:10px;background:#1e293b;border-radius:5px;margin-top:3px'><div style=height:100%;width:'+(bankRisk/10)+'%;background:'+color+';border-radius:5px'></div></div></div>'+
   '<a href="https://wa.me/?text=v19 LITE REAL '+(isFake?'FAKE':'REAL')+' GPS:'+lat.toFixed(4)+','+lon.toFixed(4)+' Risk:'+bankRisk+'" style="display:block;padding:8px;background:#25D366;color:#000;border-radius:6px;font-weight:900;text-align:center;text-decoration:none;margin-top:8px">📲 Share WhatsApp</a>';

   out.innerHTML=html;
  },e=>{out.innerHTML='Allow GPS: '+e.message;},{enableHighAccuracy:true,timeout:8000});
 });
}
</script>
</body></html>
