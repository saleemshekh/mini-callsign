<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Callsign - Dubai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f172a;color:#fff;padding:16px;min-height:100vh}
.header{background:linear-gradient(135deg,#1e293b,#334155);border-radius:20px;padding:20px;text-align:center;border:1px solid #334155;margin-bottom:16px}
.header h1{font-size:24px;margin-bottom:6px}
.header p{color:#94a3b8;font-size:13px}
.card{background:#1e293b;border-radius:16px;padding:16px;border:1px solid #334155;margin-bottom:16px}
.btn{width:100%;padding:18px;background:#22c55e;color:#000;font-weight:900;border:none;border-radius:14px;font-size:18px;cursor:pointer}
.btn:active{transform:scale(0.98)}
.badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800;border:1px solid}
.pass{background:#22c55e1a;color:#22c55e;border-color:#22c55e}
.fail{background:#ef44441a;color:#ef4444;border-color:#ef4444}
.warn{background:#f59e0b1a;color:#f59e0b;border-color:#f59e0b}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #33415522}
.row:last-child{border:none}
.big{font-size:28px;font-weight:900;text-align:center;margin:12px 0}
.small{color:#94a3b8;font-size:12px;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="header">
<h1>🛡️ Mini Callsign</h1>
<p>Built for Saleem Bhai | Dubai Logistics<br>7-Point Fraud Detection System</p>
</div>

<div class="card">
<button class="btn" onclick="runCheck()">📍 CHECK MY GPS NOW</button>
<div id="mainResult" class="small">Click to verify location - Real or Fake?</div>
</div>

<div class="card" id="reportCard" style="display:none">
<h3 style="margin-bottom:12px">🔍 Security Report</h3>
<div id="checkList"></div>
<div id="finalScore" class="big"></div>
</div>

<script>
function runCheck(){
const el=document.getElementById('mainResult');
el.innerHTML='⏳ Getting GPS... Please Allow Location';
if(!navigator.geolocation){el.innerHTML='❌ GPS Not Supported';return;}
navigator.geolocation.getCurrentPosition(pos=>{
let lat=pos.coords.latitude;
let lon=pos.coords.longitude;
let acc=pos.coords.accuracy;
let alt=pos.coords.altitude;
let speed=pos.coords.speed;
let timeZone=Intl.DateTimeFormat().resolvedOptions().timeZone;
let isMock=acc>200 || acc<1;
let score=100;
let checks=[];

if(acc<50){checks.push({name:'GPS Accuracy',val:acc.toFixed(1)+'m',ok:true});}else{checks.push({name:'GPS Accuracy',val:acc.toFixed(1)+'m Poor',ok:false});score-=25;}
if(!isMock){checks.push({name:'Mock Location',val:'Not Detected',ok:true});}else{checks.push({name:'Mock Location',val:'Suspected!',ok:false});score-=30;}
checks.push({name:'Timezone',val:timeZone,ok:timeZone.includes('Dubai')||timeZone.includes('Asia')});
if(alt!==null){checks.push({name:'Altitude',val:alt.toFixed(1)+'m',ok:true});}else{checks.push({name:'Altitude',val:'Not Available',ok:false});score-=10;}
if(speed!==null){checks.push({name:'Movement Speed',val:speed.toFixed(1)+' m/s',ok:true});}else{checks.push({name:'Movement Speed',val:'0 (Stationary)',ok:true});}
checks.push({name:'Coordinates',val:lat.toFixed(5)+','+lon.toFixed(5),ok:true});
checks.push({name:'Device Time',val:new Date().toLocaleString(),ok:true});

let status=score>=80?'✅ REAL LOCATION':score>=50?'⚠️ SUSPICIOUS':'❌ FAKE GPS';
let badgeClass=score>=80?'pass':score>=50?'warn':'fail';

el.innerHTML=`<div class="big">${status}</div><span class="badge ${badgeClass}">Trust Score: ${score}%</span><div class="small">Lat: ${lat.toFixed(5)} | Lon: ${lon.toFixed(5)}<br>Accuracy: ${acc.toFixed(1)}m</div>`;

let html='';
checks.forEach(c=>{
let cls=c.ok?'pass':'fail';
html+=`<div class="row"><span>${c.name}</span><span class="badge ${cls}">${c.val}</span></div>`;
});
document.getElementById('checkList').innerHTML=html;
document.getElementById('finalScore').innerHTML=`<span class="badge ${badgeClass}" style="font-size:16px;padding:8px 16px">FINAL: ${score}% ${score>=80?'SAFE':'RISK'}</span>`;
document.getElementById('reportCard').style.display='block';
},err=>{
el.innerHTML='❌ Location Error: '+err.message+'<br><span class="small">Please enable Location permission in Chrome</span>';
},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
</script>
</body>
</html>
