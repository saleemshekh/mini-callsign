<script>
let ipData = null;
async function init(){
 try{
  let r=await fetch('https://ipapi.co/json/');
  let d=await r.json();
  ipData=d;
  document.getElementById('ipText').textContent='IP: '+d.ip+' • '+d.city;
  document.getElementById('ipGeo').textContent='📍 IP Location: '+d.country_name+' • '+d.city+' ('+d.country_code+')';
  document.getElementById('ipASN').textContent='🗄️ ASN: '+d.org+' • Trusted';
  let tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  if(tz!==d.timezone){
    document.getElementById('vpnBadge').textContent='⚠️ VPN DETECTED';
    document.getElementById('vpnBadge').className='mt-2 inline-block text-xs bg-yellow-400 text-black px-3 py-1 rounded-full font-bold';
    document.getElementById('vpnText').textContent='⚠️ TZ Mismatch: '+tz+' vs '+d.timezone;
  }
  // AUTO CHECK GPS after 2 sec
  setTimeout(checkGPS, 2000);
 }catch(e){}
 let ua=navigator.userAgent;
 document.getElementById('deviceText').textContent='Device: '+ua.slice(0,45)+'...';
 document.getElementById('rootText').textContent=navigator.webdriver?'⚠️ WebDriver Detected':'Root/Jailbreak: None • Integrity: Verified';
}
init();

function checkGPS(){
 let readings=[];
 document.getElementById('gpsText').textContent='⏳ Taking 3 readings...';
 document.getElementById('gpsDetail').textContent='Please wait 4 seconds...';
 document.getElementById('gpsBadge').textContent='⏳ CHECKING...';
 document.getElementById('gpsBadge').className='mt-2 inline-block text-xs bg-blue-400 text-black px-3 py-1 rounded-full font-bold';
 
 function takeReading(){
  navigator.geolocation.getCurrentPosition(p=>{
   readings.push(p.coords);
   if(readings.length < 3){
    document.getElementById('gpsText').textContent=`⏳ Reading ${readings.length}/3...`;
    setTimeout(takeReading, 1200);
   } else {
    analyze(readings);
   }
  },()=>{document.getElementById('gpsText').textContent='❌ Permission Denied - Allow Location'; document.getElementById('gpsDetail').textContent='Chrome Settings > Location > Allow';},{enableHighAccuracy:true, timeout:10000, maximumAge:0});
 }
 takeReading();
}

function analyze(reads){
 let acc=reads[0].accuracy;
 let alt=reads[0].altitude;
 let speed=reads[0].speed;
 let lat=reads[0].latitude;
 let lon=reads[0].longitude;
 let fakeReasons=[];

 if(alt===null) fakeReasons.push("No Altitude (Fake App)");
 if(speed===null) fakeReasons.push("No Speed");
 if(reads[0].latitude===reads[1].latitude && reads[1].latitude===reads[2].latitude) fakeReasons.push("100% Static");
 if(acc < 3) fakeReasons.push("Too Perfect "+acc.toFixed(1)+"m");
 if(acc > 600) fakeReasons.push("Bad Accuracy "+Math.round(acc)+"m");

 if(ipData && ipData.latitude){
   let ipLat=ipData.latitude, ipLon=ipData.longitude;
   let dist=getDistance(lat, lon, ipLat, ipLon);
   // VPN ON hai to distance check ko thoda kam strict karo, warna VPN wale ko bhi fake bolega
   // Agar Fake GPS Riyadh me aur IP America me = 12000km = Pakka fake GPS ya VPN me se ek fake hai
   // Isiliye threshold 200km rakha hai
   if(dist > 200){
     fakeReasons.push(`IP-GPS Mismatch ${Math.round(dist)}km`);
   }
   document.getElementById('ipGeo').textContent=`📍 IP:${ipData.city} vs GPS:${lat.toFixed(2)},${lon.toFixed(2)} = ${Math.round(dist)}km away`;
 }

 let isFake = fakeReasons.length >= 1; // 1 reason bhi mila to FAKE

 if(isFake){
  document.getElementById('gpsBadge').textContent='🚨 FAKE GPS DETECTED';
  document.getElementById('gpsBadge').className='mt-2 inline-block text-xs bg-red-500 text-white px-3 py-1 rounded-full font-bold animate-pulse';
  document.getElementById('gpsText').textContent='🚨 FAKE: '+fakeReasons.join(" | ");
  document.getElementById('gpsDetail').textContent=`GPS: ${lat.toFixed(4)},${lon.toFixed(4)} Acc:${Math.round(acc)}m Alt:${alt||'null'}`;
  document.getElementById('gpsBar').className='h-1 bg-red-500 w-[95%] rounded';
  document.getElementById('overallStatus').textContent='THREAT DETECTED 🚨';
  document.getElementById('overallStatus').className='text-2xl md:text-3xl font-extrabold text-red-400 flex gap-2 items-center';
  document.getElementById('riskScore').textContent='78/100';
  document.getElementById('riskScore').className='text-3xl font-bold text-red-400';
  document.getElementById('riskLabel').textContent='High Risk';
  document.getElementById('riskLabel').className='text-xs bg-red-500 text-white px-3 py-1 rounded-full font-bold';
  document.getElementById('overallBadge').textContent='🚨 Fake GPS Detected • HIGH RISK';
 } else {
  document.getElementById('gpsBadge').textContent='SAFE ✓';
  document.getElementById('gpsBadge').className='mt-2 inline-block text-xs bg-green-400 text-black px-3 py-1 rounded-full font-bold';
  document.getElementById('gpsText').textContent=`✅ Real GPS - ${Math.round(acc)}m accuracy`;
  document.getElementById('gpsDetail').textContent=`GPS: ${lat.toFixed(4)},${lon.toFixed(4)} Alt:${alt?Math.round(alt)+'m':'N/A'}`;
  document.getElementById('gpsBar').className='h-1 bg-green-400 w-[75%] rounded';
 }
}
function getDistance(lat1, lon1, lat2, lon2){
 let R=6371;
 let dLat=(lat2-lat1)*Math.PI/180;
 let dLon=(lon2-lon1)*Math.PI/180;
 let a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
window.addEventListener('mousemove',()=>{document.getElementById('mouseText').textContent='Movement: Human-like - Detected';});
let last=0;
document.getElementById('typeBox').addEventListener('keydown',()=>{let now=Date.now(); if(last) document.getElementById('typingText').textContent='Behavior: Typing... '+(now-last)+'ms'; last=now;});
</script>
