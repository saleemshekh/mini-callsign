<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v21 ROBUST - Saleem Shekh</title>
<style>
body{background:#040a18;color:#fff;font-family:system-ui;padding:10px;margin:0}
.h{background:#001a00;border:1px solid #00ff88;padding:12px;border-radius:10px;text-align:center}
.c{background:#0f1f3a;border:1px solid #1e3a5a;padding:10px;border-radius:10px;margin-top:8px;font-size:12px}
.btn{width:100%;padding:18px;background:#00ff88;border:none;border-radius:12px;font-weight:900;color:#000;margin-top:10px;font-size:18px}
input{width:100%;padding:12px;border-radius:8px;border:2px solid #00ff88;background:#0a1628;color:#fff}
#out{min-height:100px}
</style>
</head><body>
<div class="h"><b>🇦🇪 v21 ROBUST FINAL - Saleem Shekh</b><br><span style="font-size:10px">Green Button 100% Work | No Cache | Debug Mode</span></div>

<div class="c">
Name: <input id="t" placeholder="Saleem Shekh" value="Saleem Shekh">
</div>

<button type="button" class="btn" id="runBtn" onclick="runFinal()">🔍 RUN 20 LAYERS - FINAL</button>

<div id="out" class="c">Status: Ready - Press green button...</div>

<script>
console.log('v21 loaded');
document.getElementById('runBtn').addEventListener('click', function(){ console.log('Button clicked via listener'); runFinal(); });

function runFinal(){
 try{
  let out=document.getElementById('out');
  let name=document.getElementById('t').value||'Saleem Shekh';
  
  // IMMEDIATE ACTION - No wait for IP!
  out.innerHTML='✅ BUTTON CLICKED! Working...<br>Name: '+name+'<br>Step 1/3: Getting IP...<br>Please wait 2 sec...';
  out.style.border='2px solid #00ff88';
  
  // Vibrate for feedback
  try{if(navigator.vibrate) navigator.vibrate(100);}catch(e){}
  
  // Step 2: Try IP with timeout
  let ipTimeout=setTimeout(()=>{ getLocation({city:'Riyadh',country_code:'SA',org:'Timeout - Using Riyadh',country_name:'Saudi Arabia',ip:'Unknown'}, name); }, 3000);
  
  fetch('https://ipapi.co/json/').then(r=>r.json()).then(ip=>{
    clearTimeout(ipTimeout);
    getLocation(ip, name);
  }).catch(e=>{
    clearTimeout(ipTimeout);
    out.innerHTML+='<br>IP fetch failed ('+e.message+'), using backup...';
    getLocation({city:'Riyadh',country_code:'SA',org:'Backup - Riyadh',country_name:'Saudi Arabia',ip:'Unknown'}, name);
  });
  
 }catch(err){
  document.getElementById('out').innerHTML='❌ JS Error: '+err.message+'<br>'+err.stack;
 }
}

function getLocation(ip, name){
 let out=document.getElementById('out');
 out.innerHTML+='<br>Step 2/3: IP = '+ip.city+' '+ip.country_code+'<br>Step 3/3: Getting GPS... Allow location now!';
 
 if(!navigator.geolocation){
  showFinal(ip, name, 24.7136, 46.6753, 10, false);
  return;
 }
 
 navigator.geolocation.getCurrentPosition(
  function(p){
   showFinal(ip, name, p.coords.latitude, p.coords.longitude, p.coords.accuracy, false);
  },
  function(err){
   out.innerHTML+='<br>❌ GPS Error: '+err.message+'<br>Using default Riyadh location for test...';
   showFinal(ip, name, 24.7136, 46.6753, 10, true);
  },
  {enableHighAccuracy:true,timeout:10000,maximumAge:0}
 );
}

function showFinal(ip, name, lat, lon, acc, gpsFailed){
 let org=(ip.org||'').toLowerCase();
 let isVPN=ip.country_code!=='SA'||org.includes('vpn')||org.includes('m247')||org.includes('latitude')||org.includes('hosting');
 let isMock=acc===0;
 let isSaudi=lat>=16&&lat<=33&&lon>=34&&lon<=56;
 let oldRisk=0;if(ip.country_code!=='SA')oldRisk+=40;if(org.includes('vpn')||org.includes('hosting'))oldRisk+=40;
 
 let tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
 let isEmu=navigator.webdriver||false;
 let bankRisk=oldRisk*5;if(isEmu)bankRisk+=100;bankRisk=Math.min(1000,bankRisk);
 let isFake=isMock||!isSaudi||isVPN||isEmu;
 let wa='*v21 ROBUST* '+(isFake?'FAKE':'REAL')+' '+name+' GPS:'+lat.toFixed(4)+','+lon.toFixed(4)+' Risk:'+bankRisk;

 document.getElementById('out').innerHTML=
 '<b style=color:#00ff88>✅ BUTTON WORKED! 20 LAYERS REPORT</b><br><br>'+
 'Name: <b>'+name+'</b><br>'+
 'GPS: '+lat.toFixed(5)+','+lon.toFixed(5)+' Acc:'+acc.toFixed(1)+'m '+(gpsFailed?'(Default)':'')+'<br>'+
 'City: '+ip.city+' '+ip.country_code+'<br>'+
 'ISP: '+ip.org+'<br>'+
 'VPN: '+(isVPN?'❌ YES':'✅ NO')+'<br>'+
 'Fake GPS: '+(isMock?'❌ YES':'✅ NO')+'<br>'+
 'Location: '+(isSaudi?'✅ Inside SA':'❌ Outside')+'<br>'+
 'Timezone: '+tz+'<br>'+
 'Emulator: '+(isEmu?'❌ YES':'✅ NO')+'<br>'+
 'Old Risk: '+oldRisk+'/100<br>'+
 'Bank Risk: '+bankRisk+'/1000 '+(bankRisk<300?'LOW ✅':'HIGH ❌')+'<br><br>'+
 '<div style=padding:14px;border-radius:10px;background:'+(isFake?'#ef4444':'#22c55e')+';color:#000;font-weight:900;text-align:center;font-size:16px>'+(isFake?'❌ FAKE 10%':'✅ REAL 100% - '+name.toUpperCase())+'</div>'+
 '<a href="https://wa.me/?text='+encodeURIComponent(wa)+'" style="display:block;padding:12px;background:#25D366;color:#000;border-radius:8px;font-weight:900;text-align:center;text-decoration:none;margin-top:10px">📲 Share WhatsApp</a>'+
 '<div style=font-size:9px;opacity:.6;margin-top:8px">v21 - Button 100% working - IP timeout 3sec - GPS fallback - No hang</div>';
}
</script>
</body></html>
