<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

body{background:#040a18;color:#fff;font-family:system-ui;padding:10px;margin:0}

</head><body>
<div class="h"><b>🇦🇪 v22 ANTI-FAKE ULTRA - Saleem Shekh</b><br><span style="font-size:10px">Acc 0.0m = 100% Fake | VPN + Fake GPS Double Detection</span></div>

<button class="btn" onclick="run()">🔍 RUN 20 LAYERS - v22</button>

<script>
async function getIP(){try{let r=await fetch('https://ipapi.co/json/');return await r.json();}catch(e){return {city:'Riyadh',country_code:'SA',org:'Backup',country_name:'Saudi Arabia',ip:'Unknown'};}}
function run(){
 let out=document.getElementById('out');let name=document.getElementById('t').value||'Saleem Shekh';
 out.innerHTML='⏳ Checking... Allow GPS...';
 getIP().then(ip=>{
  navigator.geolocation.getCurrentPosition(p=>{
   let lat=p.coords.latitude,lon=p.coords.longitude,acc=p.coords.accuracy;
   let org=(ip.org||'').toLowerCase();
   let isVPN=ip.country_code!=='SA'||org.includes('vpn')||org.includes('latitude')||org.includes('m247')||org.includes('hosting')||org.includes('choopa')||org.includes('latitude.sh');
   // FIXED: Acc 0.0m = FAKE!
   let isMock=acc===0||acc<1.0; 
   let isSaudi=lat>=16&&lat<=33&&lon>=34&&lon<=56;
   let oldRisk=0;if(ip.country_code!=='SA')oldRisk+=40;if(isVPN)oldRisk+=40;if(!isSaudi)oldRisk+=30;if(isMock)oldRisk+=50;
   let bankRisk=Math.min(1000,oldRisk*6);
   let isFake=isMock||!isSaudi||isVPN;
   let fakeReasons=[];
   if(isMock) fakeReasons.push('Acc 0.0m = Fake GPS App');
   if(!isSaudi) fakeReasons.push('Outside SA/UAE - Nigeria/Brazil');
   if(isVPN) fakeReasons.push('VPN '+ip.city+' '+ip.country_code+' ('+ip.org+')');
   out.innerHTML=
   'Name: <b>'+name+'</b><br>'+
   'GPS: '+lat.toFixed(5)+','+lon.toFixed(5)+' Acc:'+acc.toFixed(1)+'m '+(isMock?'❌ FAKE GPS YES - Acc 0.0m!':'✅ REAL Acc OK')+'<br>'+
   'IP City: '+ip.city+' '+ip.country_code+'<br>'+
   'ISP: '+ip.org+' '+(isVPN?'❌ VPN Provider':'✅')+'<br>'+
   'VPN: '+(isVPN?'❌ YES - '+ip.city+' '+ip.country_code:'✅ NO')+'<br>'+
   'Location: '+(isSaudi?'✅ Inside SA':'❌ Outside SA/UAE - '+lat.toFixed(2)+','+lon.toFixed(2)+' = Nigeria/Brazil')+'<br>'+
   'Timezone: '+Intl.DateTimeFormat().resolvedOptions().timeZone+'<br>'+
   'Old Risk: '+oldRisk+'/160<br>Bank Risk: '+bankRisk+'/1000 - '+(bankRisk<300?'LOW':'MEDIUM')+'<br><br>'+
   '<b>Fake Reasons:</b><br>'+(fakeReasons.length>0?fakeReasons.map(r=>'❌ '+r).join('<br>'):'✅ No fake')+'<br><br>'+
   '<div style=padding:14px;border-radius:10px;background:'+(isFake?'#ef4444':'#22c55e')+';color:#000;font-weight:900;text-align:center;font-size:18px>'+(isFake?'❌ FAKE 10% - BLOCKED':'✅ REAL 100%')+'</div>'+
   '<div style=font-size:10px;margin-top:6px'>Acc 0.0m = Fake GPS proof! Real phone never gives 0.0m. Real gives 3-30m.</div>'+
   '<a href="https://wa.me/?text='+encodeURIComponent('*v22* '+(isFake?'FAKE':'REAL')+' '+name+' GPS:'+lat.toFixed(4)+','+lon.toFixed(4)+' Acc:'+acc.toFixed(1)+'m IP:'+ip.city+' '+ip.country_code+' Risk:'+bankRisk+' Reasons:'+fakeReasons.join(','))+'" style="display:block;padding:12px;background:#25D366;color:#000;border-radius:8px;font-weight:900;text-align:center;text-decoration:none;margin-top:10px">📲 Share v22 Report</a>';
  },e=>{out.innerHTML='Allow GPS: '+e.message;},{enableHighAccuracy:true,timeout:10000});
 });
